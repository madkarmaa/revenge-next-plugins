# Regenerates `index.json` from the artifacts already in the pool and commits it if it changed.
#
# Use it after editing `repo.config.json` channel overrides, or after deleting an artifact to unpublish it.
# Automated releases are done regardless by the "Release plugins" workflow. This is for manual intervention only.

name: Publish repository index

on:
    workflow_dispatch:

concurrency:
    group: publish-pool
    cancel-in-progress: false

permissions:
    contents: write

env:
    # Branch holding the pool. Set the POOL_BRANCH repository variable to move it.
    POOL_BRANCH: ${{ vars.POOL_BRANCH }}
    # Set the PAGES_BASE_URL repository variable when the pool is served from a custom domain.
    PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
    POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2

            - run: bun install

            - name: Check out the published pool
              env:
                  REQUIRE_POOL: 1 # There is nothing to regenerate from without one.
              run: .github/scripts/checkout-pool.sh

            - name: Regenerate and publish index.json
              run: .github/scripts/regenerate-index.sh

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: published

    deploy:
        needs: publish
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
