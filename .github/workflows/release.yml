name: Release plugins

on:
    push:
        branches: [dev]
    workflow_dispatch:

concurrency:
    group: publish-pool
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write
    attestations: write

env:
    # Branch holding the pool. Set the POOL_BRANCH repository variable to move it.
    POOL_BRANCH: ${{ vars.POOL_BRANCH }}
    # Set the PAGES_BASE_URL repository variable when the pool is served from a custom domain.
    PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
    POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

jobs:
    release:
        if: (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch') || (github.ref == 'refs/heads/dev' && github.event_name == 'push')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25

            - run: bun install --frozen-lockfile

            - name: Check out the published pool
              run: .github/scripts/checkout-pool.sh

            - name: Release changed plugins
              id: release
              run: bun run release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }} # For Gradle to download the API dependency.
                  HUSKY: 0

            - name: Attest release artifacts
              if: ${{ !cancelled() && hashFiles('build/release-artifacts/*.zip') != '' }}
              uses: actions/attest@v4
              with:
                  subject-path: build/release-artifacts/*.zip

            - name: Update README plugin list
              if: github.ref == 'refs/heads/main'
              run: .github/scripts/update-readme.sh

            - name: Sync dev with main
              if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
              run: |
                  git fetch origin main
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  if git ls-remote --exit-code --heads origin dev > /dev/null; then
                      git fetch origin dev
                      git switch -C dev origin/dev
                      git -c core.hooksPath=/dev/null merge --no-edit -m 'chore: sync stable release to dev [skip ci]' origin/main
                  else
                      git switch -C dev origin/main
                  fi
                  git push origin dev

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: published

    deploy:
        needs: release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
