name: Open a PR to main

on:
    push:
        branches: [dev]
    workflow_dispatch:

concurrency:
    group: dev-to-main
    cancel-in-progress: false

permissions:
    contents: read
    pull-requests: write

jobs:
    pull-request:
        if: github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        steps:
            - name: Open draft pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  if [ "$(gh pr list --base main --head dev --state open --json number --jq 'length')" != 0 ]; then
                      exit 0
                  fi
                  if [ "$(gh api "repos/$GH_REPO/compare/main...dev" --jq '.ahead_by')" = 0 ]; then
                      exit 0
                  fi
                  gh pr create --base main --head dev --draft \
                      --title 'chore: merge branch `dev` to `main`' \
                      --body 'This pull request will merge branch `dev` to `main`.'
